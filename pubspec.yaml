name: actividad_graficos
description: "Dashboard de estadísticas de fútbol (TheSportsDB) con múltiples librerías de gráficos."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  fl_chart: ^1.2.0
  syncfusion_flutter_charts: ^34.2.9
  charts_flutter: ^0.12.0
  charts_flutter_updated: ^0.16.0
  graphic: ^2.7.0
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  intl: ^0.18.1

flutter:
  uses-material-design: true
