name: Syncfusion checks

on:
  push:
    branches:
      - syncfusion_flutter_charts
  pull_request:
    branches:
      - syncfusion_flutter_charts

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
